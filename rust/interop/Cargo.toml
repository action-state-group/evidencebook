[package]
name = "evidencebook-interop"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The personal-history and responder runs of the evidencebook crate, which CI checks against the Go runs and the shared vectors."
publish = false

[dependencies]
evidencebook = { path = "../evidencebook", features = ["shelf"] }
evidence-request = { version = "0.4.1", default-features = false, features = ["cll"] }
ciborium = "0.2"
ed25519-dalek = "2"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
# The shelf storage interlock's Rust side (src/shelf.rs, bin shelf).
# 0.9.0 adds `inference-history`, which tests/mesh_history.rs runs.
agent-action-capsule = { version = "0.9.0", default-features = false, features = ["strict", "inference-history"] }
base64 = "0.22"
capsule-emit-artifact = { version = "0.0.2", features = ["sqlite"] }
cll = { package = "checkpointed-local-log", version = "0.4.0" }
rusqlite = { version = "0.40", features = ["bundled"] }

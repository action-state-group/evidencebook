[package]
name = "evidencebook-interop"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The personal-history and responder runs of the evidencebook crate, which CI checks against the Go runs and the shared vectors."
publish = false

[dependencies]
evidencebook = { path = "../evidencebook" }
evidence-request = { version = "0.4.1", default-features = false, features = ["cll"] }
ciborium = "0.2"
ed25519-dalek = "2"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"

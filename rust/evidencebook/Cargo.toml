[package]
name = "evidencebook"
version = "0.0.12"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Evidence book: records, epistemic types, typed links, retention, disclosure, index classes, request answers and reconcile/close over an embedded Checkpointed Local Log -- a Rust implementation of the Evidence Layer semantics."
repository = "https://github.com/action-state-group/evidencebook"
keywords = ["evidence", "mmr", "checkpoint", "scitt"]
categories = ["cryptography"]
readme = "README.md"
documentation = "https://docs.rs/evidencebook"
# The library and the vendored schema it embeds; the tests, their vectors and
# the vocabulary script stay in the repository.
include = ["src/**/*.rs", "schemas/vendor/epistemic-types.json", "schemas/vendor/x-deal-v0/**/*.json", "vendor/x-net-publicsuffix/*", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-APACHE"]

[lib]
name = "evidencebook"
path = "src/lib.rs"

[dependencies]
cll = { package = "checkpointed-local-log", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
# Reads the profile member of a CBOR request and writes a CBOR refusal that
# carries the unsigned detail; the same version evidence-request uses.
ciborium = "0.2"
# The request draft (draft-mih-agent-evidence-request-00): its registry and
# refusal profile, the interop profile's envelope, and (`cll`) the encoders and
# checks of the Checkpointed Local Log material, on the same
# checkpointed-local-log line as this crate.
evidence-request = { version = "0.4.1", default-features = false, features = ["cll"] }
# AAC's witness receipt verifier (`witness`, feature `strict`): the served
# summary counts a checkpoint witnessed only on a receipt it verifies.
agent-action-capsule = { version = "0.8.0", default-features = false, features = ["strict"] }
# The `deal` feature's dependencies (the x-deal-v0 reference profile, module
# `deal`): its schemas' validator, the normalization of counterparty
# identifiers (Unicode normalization, case mapping, general categories, IDNA,
# the scans' patterns) and the fingerprints' HMAC. None is built without the
# feature.
boon = { version = "0.6.1", optional = true }
hmac = { version = "0.12", optional = true }
icu_casemap = { version = "2", optional = true }
icu_normalizer = { version = "2", optional = true }
icu_properties = { version = "2", optional = true }
idna = { version = "1.1", optional = true }
regex = { version = "1", optional = true }
# The `shelf` feature's dependencies (module `shelf`): the shelf's SQLite file
# (the same rusqlite line checkpointed-local-log's and the artifact store's
# `sqlite` features use), the artifact store that keeps every book's
# originals, base64 for the stored statements, and libc for the writer lock's
# flock. None is built without the feature.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
capsule-emit-artifact = { version = "0.0.2", features = ["sqlite"], optional = true }
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
# The x-deal-v0 deal record profile (module `deal`), an opt-in reference
# profile.
# Its record checks read numbers as written, as Go's json.Number does
# (agent-action-capsule's `strict` already turns this on).
deal = ["dep:boon", "dep:hmac", "dep:icu_casemap", "dep:icu_normalizer", "dep:icu_properties", "dep:idna", "dep:regex", "serde_json/arbitrary_precision"]

# The shelf (evidencebook#254 §2, module `shelf`): one subject key's books in
# one SQLite file, its writer lock or a host-held one, host logs, the heartbeat
# cadence and its witnessed chain, the same file Go and Python write.
shelf = ["cll/sqlite", "dep:rusqlite", "dep:capsule-emit-artifact", "dep:base64", "dep:libc"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
base64 = "0.22"
# The deal tests read each fixture's record as written.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
coset = "0.4"
tempfile = "3"

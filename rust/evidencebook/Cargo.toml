[package]
name = "evidencebook"
version = "0.0.8"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Evidence book: records, epistemic types, typed links, retention, disclosure, index classes, request answers and reconcile/close over an embedded Checkpointed Local Log -- a Rust implementation of the Evidence Layer semantics."
repository = "https://github.com/action-state-group/evidencebook"
keywords = ["evidence", "mmr", "checkpoint", "scitt"]
categories = ["cryptography"]
readme = "README.md"
documentation = "https://docs.rs/evidencebook"
# The library and the vendored schema it embeds; the tests, their vectors and
# the vocabulary script stay in the repository.
include = ["src/**/*.rs", "schemas/vendor/epistemic-types.json", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-APACHE"]

[lib]
name = "evidencebook"
path = "src/lib.rs"

[dependencies]
cll = { package = "checkpointed-local-log", version = "0.3.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
# Reads the profile member of a CBOR request and writes a CBOR refusal that
# carries the unsigned detail; the same version evidence-request uses.
ciborium = "0.2"
# The request draft (draft-mih-agent-evidence-request-00): its registry and
# refusal profile, the interop profile's envelope, and (`cll`) the encoders and
# checks of the Checkpointed Local Log material, on the same
# checkpointed-local-log line as this crate.
evidence-request = { version = "0.2", default-features = false, features = ["cll"] }
# AAC's witness receipt verifier (`witness`, feature `strict`): the served
# summary counts a checkpoint witnessed only on a receipt it verifies.
agent-action-capsule = { version = "0.4.1", default-features = false, features = ["strict"] }

[dev-dependencies]
base64 = "0.22"
coset = "0.4"
tempfile = "3"

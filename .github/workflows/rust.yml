# SPDX-License-Identifier: Apache-2.0
# The Rust evidencebook crate (rust/evidencebook/), moved here from
# checkpointed-local-log with its history: the vocabulary gate (the crate
# carries no deployment vocabulary), format, Clippy, tests, rustdoc with
# warnings as errors, and the crates.io package checks (never a real publish).
# The crate depends on checkpointed-local-log from crates.io, so the dry run
# resolves it as a real upload would. The interop job runs the crate's
# personal-history and responder programs (rust/interop) against the shared
# vectors and the Go runs.
name: Rust CI

on:
  push:
    branches: [main]
    paths: ["rust/**", "testdata/refusal-interop/**", "testdata/evidence-request/**", "testdata/shelf/**", "testdata/card-registration/**", "testdata/staple/**", "testdata/history-card-2/**", "testdata/staple-3/**", "testdata/standard-history-respond/**", "testdata/mesh-history/**", "testdata/row-status/**", "testdata/deal-v1/**", "rowstatus/**", "test/interop/shelf/**", "test/interop/personal-history/**", "test/interop/responder/**", "test/interop/python-profile/**", "test/interop/python-personal/**", "dealprofile/**", "*.go", "go.mod", "go.sum", ".github/workflows/rust.yml", ".github/scripts/check_crate_metadata.py"]
  # Every pull request, so `Rust result` can be a required check; the changes job
  # skips the rest when the pull request touches none of the push paths.
  pull_request:

permissions:
  contents: read

# A newer push cancels a pull request's run; main's runs queue instead, so a
# started main run always finishes and reports.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

jobs:
  changes:
    # Whether a pull request touches this workflow's push paths
    # (.github/scripts/paths-changed.sh); every other event runs everything.
    name: Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          run=$(bash .github/scripts/paths-changed.sh .github/workflows/rust.yml < "$RUNNER_TEMP/changed.txt")
          [[ "$run" == true || "$run" == false ]]
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo ".github/workflows/rust.yml push paths changed: $run" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Rust tests
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Vocabulary gate
        run: evidencebook/scripts/check-vocabulary.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  windows:
    # The shelf on a host-held lock opens off unix (evidencebook#254 §2.4):
    # the Mesh plugin's Windows nodes migrate onto it. The shelf's own lock is
    # unix-only, and its tests that need it are too.
    name: Rust shelf on Windows (host-held lock)
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: The shelf's tests
        run: cargo test --locked -p evidencebook --features shelf --test shelf

  package:
    name: crates.io package check (dry run)
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # crates.io checks keywords, categories, description, license and
      # repository at upload; `cargo publish --dry-run` does not.
      - name: Crate metadata meets crates.io's publish rules
        run: python3 ../.github/scripts/check_crate_metadata.py evidencebook/Cargo.toml

      # The library, its README and CHANGELOG and the vendored schema it
      # embeds; never tests, vectors, keys or build output.
      - name: Package file list
        run: |
          set -euo pipefail
          cargo package --locked --list -p evidencebook > "$RUNNER_TEMP/evidencebook.list"
          cat "$RUNNER_TEMP/evidencebook.list"
          if grep -E '^(tests|examples|scripts|target)/|vectors|\.(pem|key|env)$' "$RUNNER_TEMP/evidencebook.list"; then
            echo "::error::evidencebook packages a file it must not ship"; exit 1
          fi

      - name: Publish dry run (no upload)
        run: cargo publish --locked --dry-run -p evidencebook --all-features

  interop:
    name: Interop (the History run byte for byte, and the profile verifier over the responder's replies)
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
          persist-credentials: false
      # The profile's reference verifier and vectors and the History corpus,
      # at the commit ci.yml's interop-profile and personal-history jobs pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f143a18edb42f499a8837beeef1588fd70f71835
          path: agent-action-capsule
          persist-credentials: false
      # evidence-interop/1's vectors and the reference verifier that checks
      # /1, at an AAC main commit that carries both (ci.yml pins the same).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f409c43ac2d02b84622414a05881bdf2c8899d0a
          path: agent-action-capsule-v1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the verifiers' dependencies
        run: python -m pip install "cryptography>=42" pytest
      - name: Build the interop programs
        run: cargo build --locked --manifest-path evidencebook/rust/Cargo.toml -p evidencebook-interop
      - name: Reproduce the History responder run byte for byte, rebuild the corpus from it, and match Go's -correlated run
        shell: bash
        env:
          PYTHONPATH: agent-action-capsule/python
        run: |
          set -euo pipefail
          bin=evidencebook/rust/target/debug
          corpus=agent-action-capsule/vectors/personal-history-basic-v0
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          "$bin/personal-history" > "$work/run.json"
          want=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["responder"]["run_sha256"])' "$corpus/manifest.json")
          got=$(sha256sum "$work/run.json" | cut -d' ' -f1)
          echo "run_sha256: want $want, got $got"
          test "$got" = "$want"
          cmp "$corpus/responder-run.json" "$work/run.json"
          mkdir -p "$work/out/producer"
          cp "$corpus/README.md" "$work/out/"
          cp "$corpus/producer/main.go" "$work/out/producer/"
          python agent-action-capsule/python/scripts/generate_personal_history_basic_v0_vectors.py --out "$work/out" --run "$work/run.json"
          diff -r "$corpus" "$work/out"
          junit=$(mktemp)
          python -m pytest -p no:cacheprovider -rA --junitxml="$junit" \
            agent-action-capsule/python/tests/test_personal_history_basic_v0_vectors.py
          python evidencebook/test/interop/python-personal/count_by_class.py "$junit" "$corpus/vectors.json"
          "$bin/personal-history" --correlated > "$work/correlated.json"
          go -C evidencebook run ./test/interop/personal-history -correlated > "$work/correlated-go.json"
          cmp "$work/correlated-go.json" "$work/correlated.json"
      - name: Answer the profile vectors' requests, verify every reply, and compare with the Go run
        shell: bash
        run: |
          set -euo pipefail
          # Under each profile the book answers, against that profile's vectors.
          for profile in evidence-interop/0 evidence-interop/1; do
          aac=agent-action-capsule
          if [ "$profile" = evidence-interop/1 ]; then aac=agent-action-capsule-v1; fi
          work=$(mktemp -d)
          mkdir "$work/rs" "$work/go"
          evidencebook/rust/target/debug/responder -profile "$profile" "$work/rs" "$work/rs/responder.json"
          python evidencebook/test/interop/python-profile/verify_responder.py "$aac" "$work/rs/responder.json"
          go -C evidencebook run ./test/interop/responder -profile "$profile" "$work/go" "$work/go/responder.json"
          python - "$work/rs/responder.json" "$work/go/responder.json" <<'PY'
          import json, sys
          rs, go = (json.load(open(path)) for path in sys.argv[1:])
          # The crate answers over the native binding only, so it writes
          # every member Go writes except exactly these carriage members.
          carriage = {"agent_card", "carriage", "manifests", "mcp_manifest", "mcp_tools"}
          only_go, only_rs = set(go) - set(rs), set(rs) - set(go)
          if only_go != carriage or only_rs:
              raise SystemExit(f"members only the Go run writes: {sorted(only_go)} (expected {sorted(carriage)}); only the Rust run: {sorted(only_rs)}")
          differ = [name for name in rs if rs[name] != go[name]]
          if differ:
              raise SystemExit(f"members the Rust run writes differ from the Go run: {differ}")
          print(f"the Rust run writes these members as the Go run writes them: {sorted(rs)}")
          PY
          cmp "$work/rs/artifact-alice-json-nonce-c.bin" "$work/rs/artifact-bob-cbor-nonce-d.bin"
          for f in artifact-alice-json-nonce-c.bin artifact-bob-cbor-nonce-d.bin; do cmp "$work/rs/$f" "$work/go/$f"; done
          rm -rf "$work"
          done

  result:
    # One result to require in branch protection: the changes job succeeded and
    # no job failed or was cancelled (a job it skipped counts as passed).
    name: Rust result
    if: always()
    needs: [changes, test, windows, package, interop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        working-directory: ${{ github.workspace }}
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES; jobs: $RESULTS"
          test "$CHANGES" = success
          for r in $RESULTS; do [[ "$r" == success || "$r" == skipped ]]; done

  report-failure:
    # A red run on main reaches a person the same day: it opens or comments on
    # one issue. A cancelled run is not reported.
    name: report a red main run
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, test, windows, package, interop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report on the issue
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Rust CI failed on main
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-failure.sh

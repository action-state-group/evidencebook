name: CI

# A pull request runs only the jobs its changes reach (the changes job), the
# race detector only over the root packages it changes, and the Goose loop only
# when the loop's own files change: lanes run the rest locally before push.
# Push to main and the nightly run everything, and a red run there opens or
# comments on an issue (evidencebook#925).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

# A newer push cancels a pull request's run; main's runs queue instead, so a
# started main run always finishes and reports.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which jobs a pull request needs. `root`: any path outside the nested
    # modules (capsulectl/, report/, each with its own workflow), the changelog
    # fragments and the other workflows. `race`: the root packages to race
    # (.github/scripts/race-packages.sh). `goose`: the Goose loop's own files.
    # Every other event runs everything.
    name: CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      root: ${{ steps.changes.outputs.root }}
      race: ${{ steps.changes.outputs.race }}
      goose: ${{ steps.changes.outputs.goose }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            printf 'root=true\nrace=./...\ngoose=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          # grep exits 0 on a match, 1 on none and 2 on an error, which fails the job.
          matched() { local st=0; grep "$@" "$RUNNER_TEMP/changed.txt" > /dev/null || st=$?; ((st < 2)) || exit 1; ((st == 0)); }
          root=false
          if matched -vE '^(capsulectl/|report/|changelog\.d/|\.github/workflows/(capsulectl|capsulectl-core-main|rust|report|leak-lint|changelog-fragments|publish-rust|release|prepare-release|tag-release)\.yml$)'; then
            root=true
          fi
          goose=false
          if matched -E '^(python/examples/goose/|test/interop/goose-capsule/|\.github/workflows/ci\.yml$)'; then
            goose=true
          fi
          # A checked assignment, not a pipeline: a script error fails this job.
          race=$(bash .github/scripts/race-packages.sh root < "$RUNNER_TEMP/changed.txt")
          race=${race//$'\n'/ }
          printf 'root=%s\nrace=%s\ngoose=%s\n' "$root" "$race" "$goose" >> "$GITHUB_OUTPUT"
          printf 'root jobs: %s; race over: %s; Goose loop: %s\n' "$root" "${race:-nothing}" "$goose" >> "$GITHUB_STEP_SUMMARY"

  ci-scripts:
    # The CI planning and reporting scripts' tests (.github/scripts), on every
    # pull request: they also check every job of the four gated workflows is in
    # its aggregate's and reporter's needs.
    name: CI scripts
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests
        run: bash .github/scripts/ci-scripts_test.sh

  quality:
    name: Quality
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A chat link opens only inside the private chat community, so a public file cites the
      # issue or PR comment that records the message instead (evidencebook#861). The pattern
      # is split so this file does not match itself.
      - name: No private chat links in tracked files
        run: |
          if git grep -nI -e 'buzz:/''/'; then
            echo "::error::cite the issue or PR comment that records the message, not a chat link"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...

  unit:
    name: Unit tests
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        # On a pull request the Race tests job runs the same tests, with the
        # race detector, over the packages it plans; this job runs the rest
        # (evidencebook#1038). No test in this module changes under the race
        # detector (no race build tag or race sampling; .github/scripts/
        # ci-scripts_test.sh checks that). Push to main and the nightly run all.
        env:
          EVENT: ${{ github.event_name }}
          RACE_PACKAGES: ${{ needs.changes.outputs.race }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then go test ./...; exit; fi
          read -r -a planned <<<"$RACE_PACKAGES"
          raced=""
          if ((${#planned[@]})); then raced=$(go list "${planned[@]}"); fi
          rest=$(comm -23 <(go list ./... | sort) <(printf '%s\n' "$raced" | sort))
          if [[ -z "$rest" ]]; then echo "The Race tests job runs every package's tests."; exit 0; fi
          echo "Race tests runs: ${raced:-none}" | tr '\n' ' '; echo
          # shellcheck disable=SC2086 # import paths, one per line
          go test $rest

  race:
    name: Race tests
    needs: [changes]
    if: needs.changes.outputs.race != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test
        # From a queue, one process per CPU (GOMAXPROCS when a local gate sets
        # it): the root package's and dealprofile/xdealv1's tests run one at a
        # time in a process, so one `go test -race` process each took most of
        # its 10-minute timeout under load (evidencebook#1079).
        env:
          RACE_PACKAGES: ${{ needs.changes.outputs.race }}
        run: |
          read -r -a packages <<<"$RACE_PACKAGES"
          bash .github/scripts/go-test-queue.sh --label race --timeout 10m --flag -race \
            --jobs "${GOMAXPROCS:-$(getconf _NPROCESSORS_ONLN)}" -- "${packages[@]}"

  verifier-pack:
    name: Third-party verifier pack (every command and value of docs/THIRD-PARTY-VERIFIER.md)
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The script downloads the page's inputs from their public URLs and runs
      # this checkout's responder, so a change that breaks a command or a
      # value the page states fails here.
      - name: Run test/cleanroom/run.sh
        run: WORK="$RUNNER_TEMP/eb-verifier-test" EB_DIR="$PWD" test/cleanroom/run.sh

  release-helper:
    name: Release helper tests
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test .github/release.py
        run: python -m pytest -q .github/test_release.py

  deal-profile:
    name: x-deal-v0 and x-deal-v1 reference checkers over the profiles' fixtures and the chains Go builds
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install "jsonschema==4.23.0"
      - name: Run check_profile.py (without jsonschema it skips the schema-stage negatives, so anything but ALL OK fails)
        working-directory: dealprofile/x-deal-v0
        run: |
          python check_profile.py | tee "$RUNNER_TEMP/check_profile.out"
          tail -n 1 "$RUNNER_TEMP/check_profile.out" | grep -qx "ALL OK"
      - name: Run x-deal-v1's check_profile.py over its fixtures (anything but ALL OK fails)
        working-directory: dealprofile/x-deal-v1
        run: |
          python check_profile.py | tee "$RUNNER_TEMP/check_profile_v1.out"
          tail -n 1 "$RUNNER_TEMP/check_profile_v1.out" | grep -qx "ALL OK"
      - name: Check testdata/chain-vectors.json is the reference checker's chain-stage verdict (Go's and Rust's chain stages are tested against it)
        run: |
          (cd dealprofile/x-deal-v0 && python check_profile.py --chain-vectors) > "$RUNNER_TEMP/chain-vectors.json"
          diff dealprofile/testdata/chain-vectors.json "$RUNNER_TEMP/chain-vectors.json"
      - name: Run check_profile.py over every chain package dealprofile builds (the reference checker's chain stage; Go and Rust run theirs over the same chains in their own tests)
        run: |
          mkdir -p "$RUNNER_TEMP/built-chains"
          DEALPROFILE_BUILT_CHAINS="$RUNNER_TEMP/built-chains" go test ./dealprofile -run TestBaselineSteps -count=1
          test "$(ls "$RUNNER_TEMP/built-chains" | wc -l)" -ge 10
          (cd dealprofile/x-deal-v0 && python check_profile.py "$RUNNER_TEMP"/built-chains/*.json) | tee "$RUNNER_TEMP/built.out"
          tail -n 1 "$RUNNER_TEMP/built.out" | grep -qx "ALL OK"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Run check_profile.py over every chain the Rust crate's deal module builds, and match them to Go's
        run: |
          mkdir -p "$RUNNER_TEMP/built-chains-rust"
          (cd rust && EVIDENCEBOOK_DEAL_BUILT_CHAINS="$RUNNER_TEMP/built-chains-rust" cargo test --locked --features deal -p evidencebook --test deal baseline_steps)
          test "$(ls "$RUNNER_TEMP/built-chains-rust" | wc -l)" -ge 10
          (cd dealprofile/x-deal-v0 && python check_profile.py "$RUNNER_TEMP"/built-chains-rust/*.json) | tee "$RUNNER_TEMP/built-rust.out"
          tail -n 1 "$RUNNER_TEMP/built-rust.out" | grep -qx "ALL OK"
          # The same chains, record for record: the same file names, and
          # each record the same JCS bytes (numbers kept as written).
          diff <(ls "$RUNNER_TEMP/built-chains") <(ls "$RUNNER_TEMP/built-chains-rust")
          for f in "$RUNNER_TEMP"/built-chains/*.json; do
            python -c 'import json, sys; a, b = (json.load(open(p), parse_int=lambda s: ("int", s), parse_float=lambda s: ("float", s)) for p in sys.argv[1:]); sys.exit(a != b)' "$f" "$RUNNER_TEMP/built-chains-rust/$(basename "$f")"
          done

  python-cll-interop:
    name: Python interoperability (bundles both ways, CLL checkpoint and proofs, -00 refusal)
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python CLL, the AAC bundle verifier and capsule-emit
        run: python -m pip install "agent-action-capsule==0.17.0" "checkpointed-local-log==0.9.0" "capsule-emit==0.17.0"
      - name: Verify a Go-produced bundle with the Python reference
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/bundle "$interop_dir/book" "$interop_dir/bundle.json" "$interop_dir/refusal.json"
          python evidencebook/test/interop/python-aac/verify_bundle.py "$interop_dir/bundle.json"
          python evidencebook/test/interop/python-cll/verify_bundle.py "$interop_dir/bundle.json"
          python evidencebook/test/interop/python-cll/verify_refusal.py "$interop_dir/refusal.json"
      - name: Verify a Python-produced bundle with this module (and refuse a tampered one)
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          python evidencebook/test/interop/python-cll/build_bundle.py "$interop_dir/bundle.json" "$interop_dir/tampered.json"
          go -C evidencebook run ./test/interop/verify "$interop_dir/bundle.json"
          if out=$(go -C evidencebook run ./test/interop/verify "$interop_dir/tampered.json" 2>&1); then
            echo "a tampered Python-produced bundle verified: $out"; exit 1
          fi
          grep -q "evidencebook rejected the bundle" <<<"$out" || { echo "the tampered bundle failed for another reason: $out"; exit 1; }
          echo "tampered copy rejected: $out"

  interop-profile:
    name: Evidence interop profile (the reference verifier over this responder's replies)
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # The profile's reference verifier (AAC #238) and its conformance
      # vectors (AAC #237, regenerated in #263), pinned to an AAC main commit
      # that carries both: the one that regenerated the personal-history
      # corpus for the CLL -02 bare `sub` (agent-action-capsule#623).
      - name: Check out the profile's reference verifier and vectors
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f143a18edb42f499a8837beeef1588fd70f71835
          path: agent-action-capsule
      # evidence-interop/1's vectors (vectors/interop-profile-v1/) and the
      # reference verifier that checks /1, at an AAC main commit that
      # carries both; the /0 checks above stay on their own pin.
      - name: Check out the evidence-interop/1 vectors and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f409c43ac2d02b84622414a05881bdf2c8899d0a
          path: agent-action-capsule-v1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the verifier's one dependency
        run: python -m pip install "cryptography>=42"
      - name: Answer the vectors' requests, then verify every reply with the reference verifier
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/responder "$interop_dir" "$interop_dir/responder.json"
          python evidencebook/test/interop/python-profile/verify_responder.py agent-action-capsule "$interop_dir/responder.json"
          cmp "$interop_dir/artifact-alice-json-nonce-c.bin" "$interop_dir/artifact-bob-cbor-nonce-d.bin"
          # FR-8: request R sent over the native stream, A2A and MCP; only the
          # carriage differs, so the canonical Artifact is byte-identical.
          cmp "$interop_dir/artifact-native-cbor.bin" "$interop_dir/artifact-mcp-cbor.bin"
          cmp "$interop_dir/artifact-native-cbor.bin" "$interop_dir/artifact-a2a-cbor.bin"
      - name: Answer the evidence-interop/1 vectors' requests, then verify every reply
        shell: bash
        run: |
          set -euo pipefail
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          mkdir "$interop_dir/v0" "$interop_dir/v1"
          go -C evidencebook run ./test/interop/responder -profile evidence-interop/1 "$interop_dir/v1" "$interop_dir/v1/responder.json"
          python evidencebook/test/interop/python-profile/verify_responder.py agent-action-capsule-v1 "$interop_dir/v1/responder.json"
          cmp "$interop_dir/v1/artifact-native-cbor.bin" "$interop_dir/v1/artifact-mcp-cbor.bin"
          cmp "$interop_dir/v1/artifact-native-cbor.bin" "$interop_dir/v1/artifact-a2a-cbor.bin"
          # The profile governs the envelope, never the artifact (v1 §3.3 step 3).
          go -C evidencebook run ./test/interop/responder "$interop_dir/v0" "$interop_dir/v0/responder.json"
          for f in artifact-alice-json-nonce-c.bin artifact-bob-cbor-nonce-d.bin artifact-native-cbor.bin; do cmp "$interop_dir/v0/$f" "$interop_dir/v1/$f"; done

  personal-history:
    name: Personal-agent History vectors (reproduce the responder run, then the AAC corpus test)
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # vectors/personal-history-basic-v0/ (AAC #296): built from a run of
      # this repository's Respond by test/interop/personal-history, with the
      # profile's reference verifier and the corpus test beside it.
      - name: Check out the History vectors and their test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f143a18edb42f499a8837beeef1588fd70f71835
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the test's dependencies
        run: python -m pip install "cryptography>=42" pytest
      - name: Reproduce the responder run byte for byte, and rebuild the corpus from it
        shell: bash
        env:
          PYTHONPATH: agent-action-capsule/python
        run: |
          corpus=agent-action-capsule/vectors/personal-history-basic-v0
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # main.go is the corpus producer, byte for byte (its -correlated mode, #82,
          # leaves the default run unchanged).
          cmp "$corpus/producer/main.go" evidencebook/test/interop/personal-history/main.go
          go -C evidencebook run ./test/interop/personal-history > "$work/responder-run.json"
          want=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["responder"]["run_sha256"])' "$corpus/manifest.json")
          got=$(sha256sum "$work/responder-run.json" | cut -d' ' -f1)
          echo "run_sha256: want $want, got $got"
          test "$got" = "$want"
          cmp "$corpus/responder-run.json" "$work/responder-run.json"
          # The generator over this run must write the committed corpus.
          mkdir -p "$work/out/producer"
          cp "$corpus/README.md" "$work/out/"
          cp "$corpus/producer/main.go" "$work/out/producer/"
          python agent-action-capsule/python/scripts/generate_personal_history_basic_v0_vectors.py --out "$work/out" --run "$work/responder-run.json"
          diff -r "$corpus" "$work/out"
      - name: Run the corpus test (the reference verifier, then a History evaluator of its own)
        shell: bash
        env:
          PYTHONPATH: agent-action-capsule/python
        run: |
          junit=$(mktemp)
          python -m pytest -p no:cacheprovider -rA --junitxml="$junit" \
            agent-action-capsule/python/tests/test_personal_history_basic_v0_vectors.py
          python evidencebook/test/interop/python-personal/count_by_class.py "$junit" \
            agent-action-capsule/vectors/personal-history-basic-v0/vectors.json
      # capsule-cli#264 files each deal step with subject_ref <deal>/<n> and
      # correlation.exchange_id = the deal, so Respond answers a deal by
      # exchange_id, not the subject_ref fallback the corpus run takes. The
      # corpus is rebuilt from that run in a copy of the AAC checkout and
      # its test run there. The registration test is left out, since it
      # checks the committed corpus's digests in vectors/SHA256SUMS; the
      # rebuilt corpus's own SHA256SUMS is checked instead.
      - name: Rebuild the corpus from a run filed under correlation.exchange_id, then run its test
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp -R agent-action-capsule "$work/aac"
          corpus="$work/aac/vectors/personal-history-basic-v0"
          go -C evidencebook run ./test/interop/personal-history -correlated > "$work/correlated-run.json"
          find "$corpus" -mindepth 1 -maxdepth 1 ! -name README.md ! -name producer -exec rm -rf {} +
          PYTHONPATH="$work/aac/python" python "$work/aac/python/scripts/generate_personal_history_basic_v0_vectors.py" --out "$corpus" --run "$work/correlated-run.json"
          if cmp -s "$corpus/vectors.json" agent-action-capsule/vectors/personal-history-basic-v0/vectors.json; then
            echo "the correlated run rebuilt the committed corpus: -correlated changed nothing" >&2
            exit 1
          fi
          (cd "$corpus" && sha256sum -c --quiet SHA256SUMS)
          PYTHONPATH="$work/aac/python" python -m pytest -p no:cacheprovider -rA \
            "$work/aac/python/tests/test_personal_history_basic_v0_vectors.py" \
            -k "not test_sha256sums_and_registration"

  shelf-interlock:
    # The shelf storage interlock (evidencebook#254 §5 item 2): the scripted
    # shelf written by one process and continued by another, in every pair of
    # languages, each dump (by every language) equal to testdata/shelf, and
    # two writers of one file excluding each other across languages: Go,
    # Python and Rust.
    name: Shelf storage interlock
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Build the Rust side
        run: |
          cargo build --locked --manifest-path rust/Cargo.toml -p evidencebook-interop --bin shelf
          cp rust/target/debug/shelf "$RUNNER_TEMP/shelf-rs"
      - name: Build the Go side and install the Python side
        run: |
          go build -o "$RUNNER_TEMP/shelf-go" ./test/interop/shelf
          python -m pip install ./python "agent-action-capsule==0.17.0" "checkpointed-local-log==0.9.0" "capsule-emit==0.17.0" "cbor2==6.1.5"
          printf '#!/bin/sh\nexec python "%s/test/interop/python-evidencebook/shelf.py" "$@"\n' "$PWD" > "$RUNNER_TEMP/shelf-py"
          chmod +x "$RUNNER_TEMP/shelf-py"
      - name: Write, continue and compare, in every pair of languages
        run: |
          langs="go py rs"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for writer in $langs; do
            for continuer in $langs; do
              dir="$work/$writer-$continuer"
              "$RUNNER_TEMP/shelf-$writer" write "$dir" < /dev/null
              for reader in $langs; do
                "$RUNNER_TEMP/shelf-$reader" dump "$dir" > "$dir/after-write.$reader.json" < /dev/null
                cmp testdata/shelf/after-write.json "$dir/after-write.$reader.json"
              done
              "$RUNNER_TEMP/shelf-$continuer" continue "$dir" < /dev/null
              for reader in $langs; do
                "$RUNNER_TEMP/shelf-$reader" dump "$dir" > "$dir/after-continue.$reader.json" < /dev/null
                cmp testdata/shelf/after-continue.json "$dir/after-continue.$reader.json"
              done
              echo "written by $writer, continued by $continuer: every dump is the vector's"
            done
          done
      - name: Migrate a shelf another language wrote, and compare, in every pair of languages
        # evidencebook#461: Migrate and stamps (the script's migrate phase) on a
        # shelf written and continued by one language, every dump equal to
        # testdata/shelf/after-migrate.json.
        run: |
          langs="go py rs"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for writer in $langs; do
            for migrator in $langs; do
              dir="$work/$writer-$migrator"
              "$RUNNER_TEMP/shelf-$writer" write "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-$writer" continue "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-$migrator" migrate "$dir" < /dev/null
              for reader in $langs; do
                "$RUNNER_TEMP/shelf-$reader" dump "$dir" > "$dir/after-migrate.$reader.json" < /dev/null
                cmp testdata/shelf/after-migrate.json "$dir/after-migrate.$reader.json"
              done
              echo "written by $writer, migrated by $migrator: every dump is the vector's"
            done
          done
      - name: Hand over a migrated shelf, and replay every language's handover, in every pair of languages
        # evidencebook#461 §2.7: each language hands over the shelf after the
        # migrate phase to testdata/shelf/handover.json, and replays every
        # language's handover to testdata/shelf/handover-result.json.
        run: |
          langs="go py rs"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          dir="$work/s"
          "$RUNNER_TEMP/shelf-go" write "$dir" < /dev/null
          "$RUNNER_TEMP/shelf-go" continue "$dir" < /dev/null
          "$RUNNER_TEMP/shelf-go" migrate "$dir" < /dev/null
          for holder in $langs; do
            "$RUNNER_TEMP/shelf-$holder" handover "$dir" > "$work/handover.$holder.json" < /dev/null
            cmp testdata/shelf/handover.json "$work/handover.$holder.json"
            for reader in $langs; do
              "$RUNNER_TEMP/shelf-$reader" verify-handover "$work/handover.$holder.json" > "$work/result.$holder.$reader.json" < /dev/null
              cmp testdata/shelf/handover-result.json "$work/result.$holder.$reader.json"
            done
            echo "handed over by $holder: every replay is the vector's"
          done
      - name: Run the record time phase on a shelf another language migrated, and compare, in every pair of languages
        # evidencebook#461 §2.6: each language runs testdata/shelf/record-time.json
        # (witness receipts with and without a registration time, RecordTime
        # and a handover) on a shelf another language migrated, every step's
        # outcome the vector's and every dump after it equal to
        # testdata/shelf/after-record-time.json.
        run: |
          langs="go py rs"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for migrator in $langs; do
            for runner in $langs; do
              dir="$work/$migrator-$runner"
              "$RUNNER_TEMP/shelf-$migrator" write "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-$migrator" continue "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-$migrator" migrate "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-$runner" record-time "$dir" < /dev/null
              for reader in $langs; do
                "$RUNNER_TEMP/shelf-$reader" dump "$dir" > "$dir/after-record-time.$reader.json" < /dev/null
                cmp testdata/shelf/after-record-time.json "$dir/after-record-time.$reader.json"
              done
              echo "migrated by $migrator, record time run by $runner: every outcome and dump is the vector's"
            done
          done
      - name: Finish a crash Go planted, in every language
        # evidencebook#461 §7: a tree tick stored but not finished beside an
        # empty host log, and a migration stopped in its step 4; each language
        # recovers it (Migrate, then a stamp), every dump equal to the vector.
        run: |
          langs="go py rs"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # A migration stopped after its checkpoint is cut recovers to the same
          # shelf as one stopped after two appends.
          for scenario in tick:tick migration:migration migration-checkpointed:migration; do
            plant="${scenario%%:*}" vector="${scenario##*:}"
            for recoverer in $langs; do
              dir="$work/$plant-$recoverer"
              "$RUNNER_TEMP/shelf-go" write "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-go" continue "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-go" "plant-$plant" "$dir" < /dev/null
              "$RUNNER_TEMP/shelf-$recoverer" recover "$dir" < /dev/null
              for reader in $langs; do
                "$RUNNER_TEMP/shelf-$reader" dump "$dir" > "$dir/after.$reader.json" < /dev/null
                cmp "testdata/shelf/after-recover-$vector.json" "$dir/after.$reader.json"
              done
              echo "$plant planted by go, recovered by $recoverer: every dump is the vector's"
            done
          done
      - name: A record with a field and no payload, every dump Go's
        # evidencebook#538: Go plants a book whose one record commits a field
        # and no payload (its field_commitments an object); each language's
        # dump, its records' retention included, must be Go's. The field's
        # nonce is fresh each run, so the dumps are compared, not a vector.
        run: |
          langs="go py rs"
          dir=$(mktemp -d)/s
          "$RUNNER_TEMP/shelf-go" write "$dir" < /dev/null
          "$RUNNER_TEMP/shelf-go" continue "$dir" < /dev/null
          "$RUNNER_TEMP/shelf-go" plant-fields "$dir" < /dev/null
          for reader in $langs; do
            "$RUNNER_TEMP/shelf-$reader" dump "$dir" > "$dir.$reader.json" < /dev/null
            cmp "$dir.go.json" "$dir.$reader.json"
          done
          python -c 'import json, sys; r = [x for x in json.load(open(sys.argv[1]))["records"]["records"] if x["book_id"] == "fields/a"]; assert [x["retention"] for x in r] == ["AVAILABLE"], r' "$dir.go.json"
          echo "a field-only record: every dump is Go's"
      - name: Two writers of one file exclude each other, in every pair of languages
        run: |
          langs="go py rs"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          "$RUNNER_TEMP/shelf-go" write "$work/s"
          for holder in $langs; do
            for trier in $langs; do
              rm -f "$work/held"
              "$RUNNER_TEMP/shelf-$holder" hold "$work/s" 20 > "$work/held" < /dev/null &
              pid=$!
              for _ in $(seq 100); do grep -q held "$work/held" && break; sleep 0.1; done
              grep -q held "$work/held"
              code=0
              "$RUNNER_TEMP/shelf-$trier" try "$work/s" 500 < /dev/null || code=$?
              test "$code" -eq 3
              kill "$pid"
              wait "$pid" || true
              "$RUNNER_TEMP/shelf-$trier" try "$work/s" 5000 < /dev/null
              echo "$holder holds, $trier waits"
            done
          done
      - name: Caller-sealed records (a deal book's steps), written and continued in every pair of Go and Python
        run: |
          go build -o "$RUNNER_TEMP/sealed-go" ./test/interop/caller-sealed
          printf '#!/bin/sh\nexec python "%s/test/interop/python-evidencebook/caller_sealed.py" "$@"\n' "$PWD" > "$RUNNER_TEMP/sealed-py"
          chmod +x "$RUNNER_TEMP/sealed-py"
          langs="go py"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for writer in $langs; do
            for continuer in $langs; do
              dir="$work/$writer-$continuer"
              "$RUNNER_TEMP/sealed-$writer" write "$dir" < /dev/null
              "$RUNNER_TEMP/sealed-$continuer" continue "$dir" < /dev/null
              "$RUNNER_TEMP/sealed-$writer" continue "$dir" < /dev/null
              for reader in $langs; do
                "$RUNNER_TEMP/sealed-$reader" read "$dir" > "$dir/read.$reader.json" < /dev/null
              done
              cmp "$dir/read.go.json" "$dir/read.py.json"
              test "$(grep -c '"seq"' "$dir/read.go.json")" -eq 3
              echo "written by $writer, continued by $continuer: both readers open every step"
            done
          done

  row-status-diff:
    # The row status differential check (evidencebook#461, acceptance 6): Go,
    # Rust and Python give the same result, or all refuse, on 100,000 random
    # inputs; the hand-written vectors in testdata/row-status pin the rule.
    name: Row status differential
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Build the Go and Rust sides, install the Python side
        run: |
          go build -o "$RUNNER_TEMP/row-status-go" ./test/interop/row-status
          cargo build --locked --manifest-path rust/Cargo.toml -p evidencebook-interop --bin row-status
          cp rust/target/debug/row-status "$RUNNER_TEMP/row-status-rs"
          python -m pip install ./python "agent-action-capsule==0.17.0" "checkpointed-local-log==0.9.0" "capsule-emit==0.17.0" "cbor2==6.1.5"
      - name: Compare on random inputs
        run: |
          for seed in 1 2 3 4 5; do
            python test/interop/row-status/diff.py "$RUNNER_TEMP/row-status-go" "$RUNNER_TEMP/row-status-rs" --n 20000 --seed "$seed"
          done

  deal-v1-diff:
    # The x-deal-v1 differential check (evidencebook#461, design §11.1 item
    # 6): Go, Rust and Python accept or refuse each record mutated from a
    # fixture at the same stage, and build the same status value and report
    # from mutated books, on 20,000 random inputs; the shared vectors under
    # testdata/deal-v1 pin the profile by hand.
    name: x-deal-v1 differential
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Build the Go and Rust sides
        run: |
          go build -o "$RUNNER_TEMP/deal-v1-go" ./test/interop/deal-v1
          cargo build --locked --manifest-path rust/Cargo.toml -p evidencebook-interop --bin deal-v1
          cp rust/target/debug/deal-v1 "$RUNNER_TEMP/deal-v1-rs"
      - name: Install the Python side
        run: python -m pip install ./python "agent-action-capsule==0.17.0" "checkpointed-local-log==0.9.0" "capsule-emit==0.17.0" "cbor2==6.1.5"
      - name: Compare on random inputs
        # Python is compared with Go on every kind it answers
        # (python_side.py).
        run: |
          for seed in 1 2 3 4 5; do
            python test/interop/deal-v1/diff.py "$RUNNER_TEMP/deal-v1-go" "$RUNNER_TEMP/deal-v1-rs" --python python --n 4000 --seed "$seed"
          done

  goose:
    # The Goose loop reference (python/examples/goose, evidencebook#265, #624): its node is a capsulectl-deal
    # profile, so this builds the plugin from this checkout and capsule-engine's admission command, runs the
    # tests and the scripted two-node run over MCP stdio, has Go verify every bundle the run wrote
    # (`capsulectl-deal verify --bundle`) and the model-call Capsule (test/interop/goose-capsule), and checks
    # each node's step 03 commitment through the loop's checker. The run waits for the cadence ticks a report
    # rests on (about six minutes).
    name: Goose loop reference (scripted run on capsulectl, bundles Go verifies)
    needs: [changes]
    if: needs.changes.outputs.goose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the capsulectl-deal plugin from this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go -C capsulectl build -o "$RUNNER_TEMP/bin/capsulectl-deal" ./cmd/capsulectl-deal
      - name: Check out capsule-engine at go/v0.6.0 (the admission command a deal's agreement cites)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/capsule-engine
          ref: c9e72572a020d2b22a44d20f0aad7345033598da
          path: capsule-engine
          persist-credentials: false
      - name: Build capsule-engine
        run: GOWORK=off go -C capsule-engine/go build -o "$RUNNER_TEMP/bin/capsule-engine" ./cmd/capsule-engine
      - name: Install the example's Python dependencies
        run: python -m pip install pytest cryptography "mcp==2.3.0" "websockets==17.4"
      - name: Check out the loop's commitment checker (step 03)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: evidence-network/loop
          # A commit that accepts a commitment stapling history_card/2 (loop#467).
          ref: b3b0617c3e6249c96c866bea39c0f94d39bba110
          path: loop-checkout
          persist-credentials: false
      - name: Test the reference, run it, and have Go and the loop's checker check what it wrote
        env:
          GOOSE_CAPSULECTL_DEAL: ${{ runner.temp }}/bin/capsulectl-deal
          GOOSE_CAPSULE_ENGINE: ${{ runner.temp }}/bin/capsule-engine
          GOOSE_LOOP_SCRIPTS: loop-checkout/scripts
          GOOSE_GO_CHECK: "1"
        run: python -m pytest -q python/examples/goose/tests

  registry-conformance:
    name: Registry conformance (every registry-governed value the book seals is registered on its axis)
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # The producer-side registry conformance check
      # (agent_action_capsule.registry_conformance), pinned to the AAC main
      # commit that merged it (#241).
      - name: Check out the registry conformance check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: 7fabe9a5c3fe2efbeb45ac4b222f0021455acf7f
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the check's dependencies
        run: python -m pip install "cryptography>=42" "cbor2>=5"
      - name: Check every capsule a book seals, one record per link type plus a bundle
        shell: bash
        env:
          PYTHONPATH: agent-action-capsule/python
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/capsules "$interop_dir/book" "$interop_dir/capsules.json"
          python -m agent_action_capsule.registry_conformance "$interop_dir/capsules.json"
          # The check must bite: records sealed by the previous writer carry
          # link types in references[].citation_purpose and must fail it.
          python -c 'import json, sys; json.dump([json.loads(l)["capsule"] for l in open(sys.argv[1])], open(sys.argv[2], "w"))' \
            evidencebook/testdata/legacy-citation-purpose/book/records/records.jsonl "$interop_dir/legacy.json"
          if out=$(python -m agent_action_capsule.registry_conformance "$interop_dir/legacy.json"); then
            echo "the check passed records that carry link types as citation_purpose"; exit 1
          fi
          grep -q "is not registered on citation_purpose" <<<"$out" || { echo "the legacy records failed for another reason: $out"; exit 1; }
          echo "legacy records rejected as expected:"; echo "$out"

  python:
    name: Python package (unit tests, the evidence-request corpus, the profile verifier, the History run byte for byte)
    needs: [changes]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # The profile's reference verifier and vectors and the History corpus,
      # at the commit the interop-profile and personal-history jobs pin.
      - name: Check out the profile's reference verifier and the History vectors
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f143a18edb42f499a8837beeef1588fd70f71835
          path: agent-action-capsule
      # evidence-interop/1's vectors (vectors/interop-profile-v1/) and the
      # reference verifier that checks /1, at an AAC main commit that
      # carries both; the /0 checks stay on the pin above.
      - name: Check out the evidence-interop/1 vectors and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: f409c43ac2d02b84622414a05881bdf2c8899d0a
          path: agent-action-capsule-v1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      # jsonschema 4.23.0 is the reference checker's, whose wording the
      # profile's negative fixtures quote (the deal-profile job pins it too).
      - name: Install the package and its pinned dependencies
        run: python -m pip install "./evidencebook/python[test]" "agent-action-capsule==0.17.0" "checkpointed-local-log==0.9.0" "capsule-emit==0.17.0" "cbor2==6.1.5" "jsonschema==4.23.0"
      # evidence.evaluate runs capsule-engine go/v0.3.0's `admission evaluate`
      # (capsule-engine#278); build it and hold it to the shared admission vectors.
      - name: Check out capsule-engine at go/v0.3.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/capsule-engine
          ref: ebc0e4949e35a89ede9c0116411ff355103b65e6
          path: capsule-engine
      - name: Build the admission evaluate command
        run: GOWORK=off go -C capsule-engine/go build -o "$RUNNER_TEMP/capsule-engine" ./cmd/capsule-engine
      - name: Unit tests and testdata/evidence-request
        env:
          CAPSULE_ENGINE: ${{ runner.temp }}/capsule-engine
          CAPSULE_ENGINE_VECTORS: ${{ github.workspace }}/capsule-engine/conformance-vectors/admission/v0
        run: python -m pytest -q evidencebook/python/tests
      - name: Build the baseline deal chains in Python, check them with the reference checker, and match Go's byte for byte
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/go" "$work/py"
          DEALPROFILE_BUILT_CHAINS="$work/go" go -C evidencebook test ./dealprofile -run TestBaselineSteps -count=1
          EVIDENCEBOOK_DEAL_BUILT_CHAINS="$work/py" python -m pytest -q evidencebook/python/tests/test_deal.py -k baseline_steps
          test "$(ls "$work/py" | wc -l)" -ge 10
          (cd evidencebook/dealprofile/x-deal-v0 && python check_profile.py "$work"/py/*.json) | tee "$work/py.out"
          tail -n 1 "$work/py.out" | grep -qx "ALL OK"
          diff <(ls "$work/go") <(ls "$work/py")
          for f in "$work"/go/*.json; do cmp "$f" "$work/py/$(basename "$f")"; done
      - name: Reproduce the History responder run byte for byte, and its -correlated run
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          corpus=agent-action-capsule/vectors/personal-history-basic-v0
          python evidencebook/test/interop/python-evidencebook/personal_history.py > "$work/run.json"
          want=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["responder"]["run_sha256"])' "$corpus/manifest.json")
          got=$(sha256sum "$work/run.json" | cut -d' ' -f1)
          echo "run_sha256: want $want, got $got"
          test "$got" = "$want"
          cmp "$corpus/responder-run.json" "$work/run.json"
          python evidencebook/test/interop/python-evidencebook/personal_history.py --correlated > "$work/correlated.json"
          go -C evidencebook run ./test/interop/personal-history -correlated > "$work/correlated-go.json"
          cmp "$work/correlated-go.json" "$work/correlated.json"
      - name: Read every checkpoint rule as Go reads it (the differential checkpoint test)
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python evidencebook/test/interop/python-evidencebook/checkpoint_parity.py cases "$work/cases.json"
          go -C evidencebook run ./test/interop/checkpoint-parity < "$work/cases.json" > "$work/go.json"
          python evidencebook/test/interop/python-evidencebook/checkpoint_parity.py compare "$work/cases.json" "$work/go.json"
      - name: Answer the profile vectors' requests, verify every reply, and compare with the Go run
        shell: bash
        run: |
          set -euo pipefail
          # Under each profile the book answers, against that profile's vectors.
          for profile in evidence-interop/0 evidence-interop/1; do
          aac=agent-action-capsule
          if [ "$profile" = evidence-interop/1 ]; then aac=agent-action-capsule-v1; fi
          work=$(mktemp -d)
          mkdir "$work/py" "$work/go"
          python evidencebook/test/interop/python-evidencebook/responder.py --profile "$profile" "$work/py" "$work/py/responder.json"
          python evidencebook/test/interop/python-profile/verify_responder.py "$aac" "$work/py/responder.json"
          go -C evidencebook run ./test/interop/responder -profile "$profile" "$work/go" "$work/go/responder.json"
          python - "$work/py/responder.json" "$work/go/responder.json" <<'PY'
          import json, sys
          py, go = (json.load(open(path)) for path in sys.argv[1:])
          differ = [name for name in py if py[name] != go[name]]
          if differ:
              raise SystemExit(f"members the Python run writes differ from the Go run: {differ}")
          print(f"the Python run writes these members as the Go run writes them: {sorted(py)}")
          PY
          for f in artifact-alice-json-nonce-c.bin artifact-bob-cbor-nonce-d.bin; do cmp "$work/py/$f" "$work/go/$f"; done
          rm -rf "$work"
          done

  result:
    # One result to require in branch protection: the changes job succeeded and
    # no job failed or was cancelled (a job the changes skipped counts as passed).
    name: CI result
    if: always()
    needs: [changes, ci-scripts, quality, unit, race, verifier-pack, release-helper, deal-profile, python-cll-interop, interop-profile, personal-history, shelf-interlock, row-status-diff, deal-v1-diff, goose, registry-conformance, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES; jobs: $RESULTS"
          test "$CHANGES" = success
          for r in $RESULTS; do [[ "$r" == success || "$r" == skipped ]]; done

  report-failure:
    # A red run on main or the nightly reaches a person the same day: it opens
    # or comments on one issue. A cancelled run is not reported.
    name: report a red main or nightly run
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    needs: [changes, ci-scripts, quality, unit, race, verifier-pack, release-helper, deal-profile, python-cll-interop, interop-profile, personal-history, shelf-interlock, row-status-diff, deal-v1-diff, goose, registry-conformance, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: CI failed on main or the nightly
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-failure.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  race:
    name: Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test
        run: go test -race ./...

  python-cll-interop:
    name: Python interoperability (bundles both ways, CLL checkpoint and proofs, capsule-emit refusal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      - name: Check out Python CLL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/checkpointed-local-log
          ref: 88e99d405241aee790f6795fda612527679114ba
          path: checkpointed-local-log
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python CLL, the AAC bundle verifier and capsule-emit
        run: python -m pip install ./checkpointed-local-log "agent-action-capsule==0.6.0" "capsule-emit==0.8.6"
      - name: Verify a Go-produced bundle with the Python reference
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/bundle "$interop_dir/book" "$interop_dir/bundle.json" "$interop_dir/refusal.json"
          python evidencebook/test/interop/python-aac/verify_bundle.py "$interop_dir/bundle.json"
          python evidencebook/test/interop/python-cll/verify_bundle.py "$interop_dir/bundle.json"
          python evidencebook/test/interop/python-cll/verify_refusal.py "$interop_dir/refusal.json"
      - name: Verify a Python-produced bundle with this module (and refuse a tampered one)
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          python evidencebook/test/interop/python-cll/build_bundle.py "$interop_dir/bundle.json" "$interop_dir/tampered.json"
          go -C evidencebook run ./test/interop/verify "$interop_dir/bundle.json"
          if out=$(go -C evidencebook run ./test/interop/verify "$interop_dir/tampered.json" 2>&1); then
            echo "a tampered Python-produced bundle verified: $out"; exit 1
          fi
          grep -q "evidencebook rejected the bundle" <<<"$out" || { echo "the tampered bundle failed for another reason: $out"; exit 1; }
          echo "tampered copy rejected: $out"

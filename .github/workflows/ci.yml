name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  race:
    name: Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test
        run: go test -race ./...

  python-cll-interop:
    name: Python interoperability (bundles both ways, CLL checkpoint and proofs, capsule-emit refusal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      - name: Check out Python CLL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/checkpointed-local-log
          ref: 88e99d405241aee790f6795fda612527679114ba
          path: checkpointed-local-log
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python CLL, the AAC bundle verifier and capsule-emit
        run: python -m pip install ./checkpointed-local-log "agent-action-capsule==0.6.0" "capsule-emit==0.8.6"
      - name: Verify a Go-produced bundle with the Python reference
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/bundle "$interop_dir/book" "$interop_dir/bundle.json" "$interop_dir/refusal.json"
          python evidencebook/test/interop/python-aac/verify_bundle.py "$interop_dir/bundle.json"
          python evidencebook/test/interop/python-cll/verify_bundle.py "$interop_dir/bundle.json"
          python evidencebook/test/interop/python-cll/verify_refusal.py "$interop_dir/refusal.json"
      - name: Verify a Python-produced bundle with this module (and refuse a tampered one)
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          python evidencebook/test/interop/python-cll/build_bundle.py "$interop_dir/bundle.json" "$interop_dir/tampered.json"
          go -C evidencebook run ./test/interop/verify "$interop_dir/bundle.json"
          if out=$(go -C evidencebook run ./test/interop/verify "$interop_dir/tampered.json" 2>&1); then
            echo "a tampered Python-produced bundle verified: $out"; exit 1
          fi
          grep -q "evidencebook rejected the bundle" <<<"$out" || { echo "the tampered bundle failed for another reason: $out"; exit 1; }
          echo "tampered copy rejected: $out"

  interop-profile:
    name: Evidence interop profile (the reference verifier over this responder's replies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # The profile's reference verifier (AAC #238) and its conformance
      # vectors (AAC #237, regenerated in #263), pinned to an AAC main commit
      # that carries both: the one that added the personal-history vectors
      # (#296). vectors/interop-profile-v0/ there is unchanged since #263.
      - name: Check out the profile's reference verifier and vectors
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: 0b7b1825965e7f7845cbc70a490a581cbc70bd37
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the verifier's one dependency
        run: python -m pip install "cryptography>=42"
      - name: Answer the vectors' requests, then verify every reply with the reference verifier
        shell: bash
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/responder "$interop_dir" "$interop_dir/responder.json"
          python evidencebook/test/interop/python-profile/verify_responder.py agent-action-capsule "$interop_dir/responder.json"
          cmp "$interop_dir/artifact-alice-json-nonce-c.bin" "$interop_dir/artifact-bob-cbor-nonce-d.bin"
          # FR-8: request R sent over the native stream, A2A and MCP; only the
          # carriage differs, so the canonical Artifact is byte-identical.
          cmp "$interop_dir/artifact-native-cbor.bin" "$interop_dir/artifact-mcp-cbor.bin"
          cmp "$interop_dir/artifact-native-cbor.bin" "$interop_dir/artifact-a2a-cbor.bin"

  personal-history:
    name: Personal-agent History vectors (reproduce the responder run, then the AAC corpus test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # vectors/personal-history-basic-v0/ (AAC #296): built from a run of
      # this repository's Respond by test/interop/personal-history, with the
      # profile's reference verifier and the corpus test beside it.
      - name: Check out the History vectors and their test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: 0b7b1825965e7f7845cbc70a490a581cbc70bd37
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the test's dependencies
        run: python -m pip install "cryptography>=42" pytest
      - name: Reproduce the responder run byte for byte, and rebuild the corpus from it
        shell: bash
        run: |
          corpus=agent-action-capsule/vectors/personal-history-basic-v0
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cmp "$corpus/producer/main.go" evidencebook/test/interop/personal-history/main.go
          go -C evidencebook run ./test/interop/personal-history > "$work/responder-run.json"
          want=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["responder"]["run_sha256"])' "$corpus/manifest.json")
          got=$(sha256sum "$work/responder-run.json" | cut -d' ' -f1)
          echo "run_sha256: want $want, got $got"
          test "$got" = "$want"
          cmp "$corpus/responder-run.json" "$work/responder-run.json"
          # The generator over this run must write the committed corpus.
          mkdir -p "$work/out/producer"
          cp "$corpus/README.md" "$work/out/"
          cp "$corpus/producer/main.go" "$work/out/producer/"
          python agent-action-capsule/python/scripts/generate_personal_history_basic_v0_vectors.py --out "$work/out" --run "$work/responder-run.json"
          diff -r "$corpus" "$work/out"
      - name: Run the corpus test (the reference verifier, then a History evaluator of its own)
        shell: bash
        env:
          PYTHONPATH: agent-action-capsule/python
        run: |
          junit=$(mktemp)
          python -m pytest -p no:cacheprovider -rA --junitxml="$junit" \
            agent-action-capsule/python/tests/test_personal_history_basic_v0_vectors.py
          python evidencebook/test/interop/python-personal/count_by_class.py "$junit" \
            agent-action-capsule/vectors/personal-history-basic-v0/vectors.json

  registry-conformance:
    name: Registry conformance (every registry-governed value the book seals is registered on its axis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidencebook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evidencebook
      # The producer-side registry conformance check
      # (agent_action_capsule.registry_conformance), pinned to the AAC main
      # commit that merged it (#241).
      - name: Check out the registry conformance check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/agent-action-capsule
          ref: 7fabe9a5c3fe2efbeb45ac4b222f0021455acf7f
          path: agent-action-capsule
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: evidencebook/go.mod
          cache-dependency-path: evidencebook/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the check's dependencies
        run: python -m pip install "cryptography>=42" "cbor2>=5"
      - name: Check every capsule a book seals, one record per link type plus a bundle
        shell: bash
        env:
          PYTHONPATH: agent-action-capsule/python
        run: |
          interop_dir=$(mktemp -d)
          trap 'rm -rf "$interop_dir"' EXIT
          go -C evidencebook run ./test/interop/capsules "$interop_dir/book" "$interop_dir/capsules.json"
          python -m agent_action_capsule.registry_conformance "$interop_dir/capsules.json"
          # The check must bite: records sealed by the previous writer carry
          # link types in references[].citation_purpose and must fail it.
          python -c 'import json, sys; json.dump([json.loads(l)["capsule"] for l in open(sys.argv[1])], open(sys.argv[2], "w"))' \
            evidencebook/testdata/legacy-citation-purpose/book/records/records.jsonl "$interop_dir/legacy.json"
          if out=$(python -m agent_action_capsule.registry_conformance "$interop_dir/legacy.json"); then
            echo "the check passed records that carry link types as citation_purpose"; exit 1
          fi
          grep -q "is not registered on citation_purpose" <<<"$out" || { echo "the legacy records failed for another reason: $out"; exit 1; }
          echo "legacy records rejected as expected:"; echo "$out"

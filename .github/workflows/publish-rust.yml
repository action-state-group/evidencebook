# SPDX-License-Identifier: Apache-2.0
# Adapted from agent-action-capsule publish-rust.yml at 9c10641.
# Publish the evidencebook crate to crates.io for its release tag, pushed by an
# admin: crates/evidencebook-v<version>. The tag must point at a commit on
# main, <version> must equal the crate's Cargo.toml version, and that version
# must not be on crates.io yet. The Go module's v* tags are a separate route.
#
# Authentication is crates.io Trusted Publishing (OIDC): the publish job
# exchanges GitHub's short-lived identity token for a crates.io token scoped
# to this repository, publish-rust.yml and the `crates-io` environment, which
# is revoked when the job ends. No crates.io token is stored in this
# repository. The `crates-io` environment accepts only crates/*-v* tags.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment).
name: Release · Publish Rust

on:
  push:
    tags: ["crates/*-v*"]
  # Dispatched on a crates/*-v* tag, it publishes that tag; on a branch it
  # does nothing.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: rust

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check the tag and package the crate
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/crates/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      crate: ${{ steps.tag.outputs.crate }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # The tag is read from the environment, never interpolated into the
      # script. Only the crates listed here can be published.
      - name: The tag names a crate of this workspace, on main
        id: tag
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^crates/([a-z0-9_-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not crates/<crate>-v<major.minor.patch>"; exit 1
          fi
          crate="${BASH_REMATCH[1]}"; version="${BASH_REMATCH[2]}"
          case "$crate" in
            evidencebook) ;;
            *) echo "::error::$crate is not a crate this workflow publishes"; exit 1 ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"; exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The tag version is the Cargo.toml version, and not yet on crates.io
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r --arg c "$CRATE" '.packages[] | select(.name == $c) | .version')
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::tag says $CRATE $VERSION, Cargo.toml says ${manifest:-nothing}"; exit 1
          fi
          if curl -fsS -A "publish-crates (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$CRATE/$VERSION" > /dev/null 2>&1; then
            echo "::error::$CRATE $VERSION is already on crates.io"; exit 1
          fi

      # crates.io checks keywords, categories, description, license and
      # repository at upload; `cargo publish --dry-run` does not.
      - name: Crate metadata meets crates.io's publish rules
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: python3 ../.github/scripts/check_crate_metadata.py "$CRATE/Cargo.toml"

      - name: Package contents
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo package --locked --list -p "$CRATE"

      - name: Publish dry run (no upload)
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo publish --locked --dry-run -p "$CRATE"

  publish:
    name: publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Exchange the OIDC token for a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ needs.check.outputs.crate }}
        run: cargo publish --locked -p "$CRATE"

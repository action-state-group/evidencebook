name: capsulectl

# The nested module capsulectl/ (github.com/action-state-group/evidencebook/capsulectl):
# the capsulectl plugins over evidence books and deals, one module and one
# release (capsulectl/v*), two launchers. capsulectl-book moved here from
# capsule-cli (capsule-cli#326); capsulectl-deal, with its history, from
# evidencebook-deal (evidencebook#610). It requires this repository's library
# at a version, never the working tree, so it runs on its own. Its tests do
# read fixtures from the working tree outside capsulectl/ (report/testdata and
# testdata/card-registration, testdata/live16-ask), which is why those paths
# are in the filters.
#
# A pull request runs the plain tests and the race detector only over the
# packages it changes (.github/scripts/race-packages.sh), never internal/deal's
# race pass (ten shards of about twelve minutes): lanes run that locally before
# push (CLAUDE.md). Push to main and the nightly run the full race suite, four
# jobs at a time so pull requests keep runners, and a red run there opens or
# comments on an issue (evidencebook#925).

on:
  push:
    branches: [main]
    paths: ["capsulectl/**", "report/testdata/**", "testdata/card-registration/**", "testdata/live16-ask/**", ".github/workflows/capsulectl.yml", ".github/workflows/release.yml", ".github/scripts/race-packages.sh", ".github/scripts/paths-changed.sh"]
  # Every pull request, so `capsulectl result` can be a required check; the plan
  # job skips the rest when the pull request touches none of the push paths.
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: every case under the race detector (see the tests job's env).
    - cron: '0 6 * * *'

permissions:
  contents: read

# A newer push cancels a pull request's run; main's runs queue instead, so every
# merge's full race run finishes or is replaced by a newer queued one.
concurrency:
  group: capsulectl-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: capsulectl

jobs:
  quality:
    name: capsulectl quality
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: Refuse committed env files
        # evidencebook-deal's quality job refused them; the deal's settings and
        # credentials live in a host's environment, never in this repository.
        working-directory: ${{ github.workspace }}
        run: |
          bad="$(git ls-files capsulectl | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$bad" ]; then
            printf '::error::env file(s) committed; remove them from the repository and rotate any secret they held:\n%s\n' "$bad"
            exit 1
          fi
      - name: Formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Its modules are required at versions, never replaced
        # The plugin embeds the capsulectl core it is built with
        # (capsule-cli#326, design note section 4.2).
        run: |
          if grep -n '^replace\|=> ' go.mod; then
            echo "::error::capsulectl/go.mod replaces a module; require it at a version instead"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: The confusables table matches its generator
        run: |
          go generate ./internal/deal
          git diff --exit-code -- internal/deal/confusables_table.go
      - name: The release build, dry run
        # release.yml's build, handshake check and core step for the one
        # release, on every change: the core step adds the published core
        # go.mod requires, so a defect in it shows here, not on a pushed tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/test-release-build-tar.sh
          scripts/release-build.sh v0.0.0-ci "$GITHUB_SHA" "$RUNNER_TEMP/dist"
          core=$(go list -m -f '{{.Version}}' github.com/action-state-group/capsule-cli)
          for launcher in capsulectl-book capsulectl-deal; do
            meta="$("$RUNNER_TEMP/dist/$launcher-v0.0.0-ci-linux-amd64" cli-plugin-metadata)"
            test "$(jq -r .name <<<"$meta")" = "${launcher#capsulectl-}" || { echo "unexpected name: $meta"; exit 1; }
            test "$(jq -r .version <<<"$meta")" = v0.0.0-ci || { echo "unexpected version: $meta"; exit 1; }
            test "$(jq -r .core_version <<<"$meta")" = "$core" || { echo "unexpected core_version: $meta"; exit 1; }
          done
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
          scripts/check-standard-history-archive.sh "$RUNNER_TEMP/dist/capsulectl-book-v0.0.0-ci-linux-amd64" "$RUNNER_TEMP/dist/standard-history-v0.0.0-ci.tar.gz"
          scripts/check-deal-view-archive.sh "$RUNNER_TEMP/dist/capsulectl-deal-v0.0.0-ci-linux-amd64" "$RUNNER_TEMP/dist/deal-view-v0.0.0-ci.tar.gz"
          # The core step needs a published capsule-cli release; a pin at a
          # commit (a pseudo-version, before the one release) has none, and
          # release.yml refuses to tag it anyway.
          if printf '%s\n' "$core" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?'; then
            scripts/release-core-assets.sh v0.0.0-ci "$RUNNER_TEMP/dist"
          else
            echo "::notice::capsule-cli is pinned at $core, not a release tag: the core step is skipped in this dry run"
          fi
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
          test "$(cd "$RUNNER_TEMP/dist" && ls | grep -vx SHA256SUMS | sort)" = "$(awk '{print $2}' "$RUNNER_TEMP/dist/SHA256SUMS" | sort)" \
            || { echo "SHA256SUMS does not list exactly the release's files"; exit 1; }

  plan:
    # Whether this run concerns capsulectl, and which test jobs run: on a pull
    # request three plain shards and one race job over race-packages.sh's
    # packages (none when it lists none); otherwise ten race shards and three
    # plain shards over every package.
    name: capsulectl plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: Plan
        id: plan
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          plain=$(jq -cn '[range(1;4) | {pass:"plain",shard:"\(.)/3",pkgs:"./..."}]')
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            cat "$RUNNER_TEMP/changed.txt"
            # Checked assignments: a script error fails the plan, never skips the jobs.
            run=$(bash .github/scripts/paths-changed.sh .github/workflows/capsulectl.yml < "$RUNNER_TEMP/changed.txt")
            [[ "$run" == true || "$run" == false ]]
            if [[ "$run" == false ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              # The tests job is skipped; its matrix still has to parse.
              echo 'matrix=[{"pass":"plain","shard":"1/1","pkgs":"./..."}]' >> "$GITHUB_OUTPUT"
              echo "No capsulectl input changed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            pkgs=$(bash .github/scripts/race-packages.sh capsulectl < "$RUNNER_TEMP/changed.txt")
            pkgs=${pkgs//$'\n'/ }
            echo "Race over: ${pkgs:-nothing}" >> "$GITHUB_STEP_SUMMARY"
            matrix=$(jq -cn --arg p "$pkgs" --argjson plain "$plain" \
              '(if $p == "" then [] else [{pass:"race",shard:"1/1",pkgs:$p}] end) + $plain')
          else
            matrix=$(jq -cn --argjson plain "$plain" '[range(1;11) | {pass:"race",shard:"\(.)/10",pkgs:"./..."}] + $plain')
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  tests:
    # The race detector split by test name across ten jobs, and every case
    # without it across two (scripts/test.sh), as capsulectl-deal ran them in
    # evidencebook-deal and in capsule-cli before it, where the deal package
    # outgrew one race job's 15 minutes (capsule-cli#403, #407); six jobs left
    # the first shard at 13m45s of the 15-minute limit, so eight; eight left
    # shards at up to 14m on #715's head and one past 15m once its tests moved
    # TestDealTickEveryMinuteFollowsTheJitter (170s) into a shard already
    # holding two other slow cases (#717's run), so ten. The plain pass takes
    # three shards so each finishes in about four minutes. A pull request runs
    # the plan job's smaller matrix.
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      # Main and the nightly leave the organization's other runners to pull requests.
      max-parallel: ${{ github.event_name == 'pull_request' && 16 || 4 }}
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: capsulectl test (${{ matrix.part.pass }} ${{ matrix.part.shard }})
    runs-on: ubuntu-latest
    # The nightly runs every case under the race detector; two cases alone take
    # about ten minutes there, and its shard jobs ran 7-17 minutes, up to the push
    # runs' 15-minute go test timeout (seven nightly runs in a row failed).
    timeout-minutes: ${{ github.event_name == 'schedule' && 40 || 20 }}
    env:
      CAPSULE_TEST_RACE_TIMEOUT: ${{ github.event_name == 'schedule' && '35m' || '15m' }}
      CAPSULE_TEST_RACE_FULL: ${{ github.event_name == 'schedule' && '1' || '' }}
      CAPSULE_TEST_PASS: ${{ matrix.part.pass }}
      CAPSULE_TEST_SHARD: ${{ matrix.part.shard }}
      CAPSULE_TEST_PKGS: ${{ matrix.part.pkgs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: Tests (${{ matrix.part.pass }}, shard ${{ matrix.part.shard }})
        run: bash scripts/test.sh

  result:
    # One result to require in branch protection: the plan succeeded and no
    # job failed or was cancelled (a job the plan skipped counts as passed).
    name: capsulectl result
    if: always()
    needs: [plan, quality, tests, skill, interop-at-resolved-versions, deal-pages, portability, studio-replay, presentation-pass]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        # No checkout here, so not the capsulectl/ directory the defaults name.
        working-directory: ${{ github.workspace }}
        env:
          PLAN: ${{ needs.plan.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan: $PLAN; jobs: $RESULTS"
          test "$PLAN" = success
          for r in $RESULTS; do [[ "$r" == success || "$r" == skipped ]]; done

  skill:
    # The capsulectl-book skill (capsulectl/skills/capsulectl-book): its text
    # matches the plugin's verbs, and its demo runs them against capsulectl
    # (at the version go.mod pins) plus capsulectl-book built from this checkout.
    name: capsulectl-book skill
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: The skill text matches the plugin
        run: skills/capsulectl-book/scripts/check-skill.sh
      - name: The skill's scripted demo
        run: skills/capsulectl-book/scripts/run-scripted-demo.sh

  interop-at-resolved-versions:
    # The Go <-> Python round trip at the versions this module resolves,
    # which can differ from the library's own pins (scripts/interop-resolved.sh).
    name: capsulectl interop at the resolved versions (Go <-> Python)
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: The evidencebook version this module resolves
        id: resolved
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/action-state-group/evidencebook)
          commit=$(go mod download -json "github.com/action-state-group/evidencebook@$version" | jq -er '.Origin.Hash')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "evidencebook=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out evidencebook at that version (its Python verifier scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolved.outputs.evidencebook }}
          path: .interop/evidencebook
      - name: Check out Python CLL (the commit the resolved release's scripts were written against)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: action-state-group/checkpointed-local-log
          ref: 66043701e093eaf06e66c05a86a5f13d0021f527 # python/v0.9.0
          path: .interop/checkpointed-local-log
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python CLL, the AAC bundle verifier and capsule-emit (locked, with hashes)
        run: |
          python -m pip install --no-deps ../.interop/checkpointed-local-log/python
          python -m pip install --require-hashes -r scripts/interop-requirements.txt
          python -m pip check
      - name: Install the -00 refusal verifier in its own environment (locked, with hashes)
        run: |
          python -m venv "$RUNNER_TEMP/aac-00"
          "$RUNNER_TEMP/aac-00/bin/python" -m pip install --require-hashes -r scripts/interop-refusal-requirements.txt
          "$RUNNER_TEMP/aac-00/bin/python" -m pip check
      - name: The round trip, both ways, with the tampered copies refused
        run: REFUSAL_PYTHON="$RUNNER_TEMP/aac-00/bin/python" bash scripts/interop-resolved.sh ../.interop/evidencebook

  deal-pages:
    # A deal receipt's page in headless Chrome (scripts/check-deal-pages.sh),
    # then the presentation goldens re-emitted and measured at 390px, 1280px
    # and in print in the pinned Chrome and fonts (internal/deal/
    # presentation_golden_test.go, testdata/presentation/known-overflow.json).
    name: deal pages render and check themselves
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: A deal receipt's page
        env:
          CHROME: google-chrome
        run: bash scripts/check-deal-pages.sh
      - name: Set up the pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true
      # The page's runtime draws a claim's reason words, and the deal view
      # opens a carried receipt on a settlement report, which only a browser
      # shows (internal/book/report_reason_test.go, report_receipts_test.go).
      - name: A claim's reason and a deal's receipt on the report page
        env:
          EVIDENCEBOOK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: go test -count=1 -v -run '^(TestContractReportDrawsAClaimReason|TestTheBrowserOpensACarriedReceiptAndReadsAHeldOne)$' ./internal/book
      - name: Install the pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core fontconfig
          FONTCONFIG_FILE="$GITHUB_WORKSPACE/capsulectl/testdata/presentation/fonts.conf" fc-list : family | sort -u
      - name: Presentation goldens
        env:
          CAPSULECTL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CAPSULECTL_PRESENTATION_PINNED: "1"
          CAPSULECTL_PRESENTATION_RENDERS: ${{ runner.temp }}/presentation-renders
          FONTCONFIG_FILE: ${{ github.workspace }}/capsulectl/testdata/presentation/fonts.conf
        run: go test -count=1 -v -run 'TestPresentation|TestOverflowBaselineCheck' -skip '^TestPresentationPass' ./internal/deal
      - name: Keep the presentation renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presentation-renders
          path: ${{ runner.temp }}/presentation-renders
          if-no-files-found: ignore

  portability:
    # A deal's shared copy and exported records stand on their own
    # (capsule-cli#243): see scripts/check-portability.sh.
    name: shared deal copy verifies without the session
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: Deal, share, export, delete the session, verify offline
        env:
          CHROME: google-chrome
        run: bash scripts/check-portability.sh

  studio-replay:
    # The Terms Pack Studio replay fixture lands in fresh seller and buyer stores
    # (scripts/check-studio-replay.sh).
    name: studio replay fixture lands in both stores
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: Replay ten sticker trades into a seller and a buyer store
        run: bash scripts/check-studio-replay.sh

  presentation-pass:
    # The presentation goldens' bundles through `presentation list` and
    # `presentation build` (internal/deal/presentation_pass_test.go), each
    # page opened at 390px, 1280px and in print in the pinned Chrome and
    # fonts, compared semantically.
    name: presentation pass (390px, 1280px, print)
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache-dependency-path: capsulectl/go.sum
      - name: Set up the pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true
      - name: Install the pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core fontconfig
      - name: Presentation pass
        env:
          CAPSULECTL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CAPSULECTL_PRESENTATION_PINNED: "1"
          FONTCONFIG_FILE: ${{ github.workspace }}/capsulectl/testdata/presentation/fonts.conf
        run: go test -count=1 -p 1 -v -timeout 10m -run '^TestPresentationPass' ./internal/deal

  report-failure:
    # A red run on main or the nightly reaches a person the same day: it opens
    # or comments on one issue. A cancelled run is not reported.
    name: report a red main or nightly run
    if: failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule')
    needs: [plan, quality, tests, skill, interop-at-resolved-versions, deal-pages, portability, studio-replay, presentation-pass]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report on the issue
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: capsulectl CI failed on main or the nightly
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-failure.sh

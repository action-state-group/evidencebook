name: Release · capsulectl

# The one capsulectl release (evidencebook#895 item 4): the core and both
# launchers of the nested module capsulectl/, capsulectl-book and
# capsulectl-deal, at one version, from one capsulectl/v* tag. It builds the
# launchers for linux/amd64, linux/arm64 and darwin/arm64, adds the core's
# published binaries unchanged (scripts/release-core-assets.sh), and attaches
# them, the archives the plugins unpack beside their launchers (History card,
# deal view, deal skill) and one SHA256SUMS to the GitHub release for that tag.
# The launchers stay a plugin: nothing is compiled into the core.
# capsulectl-deal used to release from evidencebook-deal (evidencebook#610).
# The build is capsulectl/scripts/release-build.sh, so a tag can be rebuilt
# with the same Go version and compared against SHA256SUMS. The binaries get a
# GitHub build provenance attestation, verifiable with
#   gh attestation verify FILE --repo action-state-group/evidencebook \
#     --signer-workflow action-state-group/evidencebook/.github/workflows/release.yml
# and the attestation bundle, which covers both launchers and every archive, is
# published as capsulectl-book-<version>.sigstore.json, and as a copy named
# capsulectl-deal-<version>.sigstore.json, the name evidencebook-deal's releases
# used (its verify commands name this repository now: RELEASING.md). The core's
# binaries keep capsule-cli's own attestation, carried as
# capsulectl-<version>.sigstore.json and verified with --repo
# action-state-group/capsule-cli; this workflow's attestation never names them.
#
# Not part of release.py and tag-release.yml: those handle manifest-versioned
# packages and create a published release before their publisher runs, which
# immutable releases would then lock (capsule-cli#326, design note section 5).
# A maintainer pushes the tag; a release reviewer approves the run in the
# environments capsulectl/scripts/release-settings.sh sets. The plugin embeds
# the capsulectl core library at the version go.mod requires, so a release
# requires capsule-cli at a published release, the tag is that version, and
# the handshake reports it as core_version.

on:
  push:
    tags: ["capsulectl/v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ contains(github.ref_name, '-') && 'capsulectl-release-candidate' || 'capsulectl-release' }}
    defaults:
      run:
        working-directory: capsulectl
    env:
      # The tag is capsulectl/vX.Y.Z (Go's tag form for the nested module);
      # the module version, and the plugin's, is vX.Y.Z.
      TAG: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write # OIDC token for the build provenance attestation
      attestations: write
    steps:
      - name: Refuse a full release re-run by someone else
        # Prevent self-review stops whoever started a run from approving it,
        # and a re-run is started by whoever re-ran it. The tag's pusher could
        # then approve their own full release, so that run stops here, before
        # anything is built (capsulectl/RELEASING.md).
        if: ${{ !contains(github.ref_name, '-') }}
        # Before the checkout, so not in capsulectl/.
        working-directory: ${{ github.workspace }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$ACTOR" = "$TRIGGERING_ACTOR" \
            || { echo "$GITHUB_REF_NAME was pushed by $ACTOR but this run was started by $TRIGGERING_ACTOR: have $ACTOR re-run it"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: capsulectl/go.mod
          cache: false
      - name: Check the tag follows the release tag policy
        # The module version follows capsule-cli's release tag policy.
        run: |
          VERSION="${TAG#capsulectl/}"
          test "capsulectl/$VERSION" = "$TAG" || { echo "tag $TAG is not capsulectl/<version>"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '%s\n' "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?' \
            || { echo "tag $VERSION does not follow the release tag policy"; exit 1; }
      - name: Check the tag is a version a shared copy keeps
        # capsulectl-deal seals its release as the producer of each record it
        # writes, and a shared copy keeps a producer only in a fixed shape.
        run: |
          printf '%s\n' "$VERSION" | grep -Eqx 'v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(rc|alpha|beta|dev)[0-9]{0,3})?' \
            || { echo "tag $VERSION is not a version a shared copy keeps (vN.N.N, up to four digits each, optionally followed by -rc, -alpha, -beta or -dev and up to three digits)"; exit 1; }
      - name: The core go.mod requires is a published capsule-cli release at the tag's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -n '^replace\|=> ' go.mod; then
            echo "go.mod replaces a module: a release requires capsule-cli at a release"; exit 1
          fi
          core=$(go list -m -f '{{.Version}}' github.com/action-state-group/capsule-cli)
          printf '%s\n' "$core" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?' \
            || { echo "go.mod requires capsule-cli at $core, not a release tag"; exit 1; }
          # One release, one version: the tag is the core's version
          # (capsulectl/RELEASING.md).
          test "$VERSION" = "$core" \
            || { echo "tag $TAG is not capsulectl/$core, the capsule-cli release go.mod requires: the one capsulectl release has the core's version"; exit 1; }
          draft=$(gh release view "$core" --repo action-state-group/capsule-cli --json isDraft --jq .isDraft) \
            || { echo "capsule-cli has no release $core"; exit 1; }
          test "$draft" = false || { echo "capsule-cli $core is not published"; exit 1; }
          echo "CORE_VERSION=$core" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Build release assets
        env:
          COMMIT: ${{ github.sha }}
        run: scripts/release-build.sh "$VERSION" "$COMMIT" dist
      - name: Check the History card archive against the handshake
        run: scripts/check-standard-history-archive.sh "dist/capsulectl-book-$VERSION-linux-amd64" "dist/standard-history-$VERSION.tar.gz"
      - name: Check the deal view archive against the handshake
        run: scripts/check-deal-view-archive.sh "dist/capsulectl-deal-$VERSION-linux-amd64" "dist/deal-view-$VERSION.tar.gz"
      - name: Check the versions the plugins report
        run: |
          for launcher in capsulectl-book capsulectl-deal; do
            meta="$(dist/"$launcher-$VERSION"-linux-amd64 cli-plugin-metadata)"
            test "$(jq -r .name <<<"$meta")" = "${launcher#capsulectl-}" || { echo "unexpected name: $meta"; exit 1; }
            test "$(jq -r .version <<<"$meta")" = "$VERSION" || { echo "unexpected version: $meta"; exit 1; }
            test "$(jq -r .core_version <<<"$meta")" = "$CORE_VERSION" || { echo "unexpected core_version: $meta"; exit 1; }
          done
      - name: Attest build provenance of the assets
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            capsulectl/dist/capsulectl-book-*
            capsulectl/dist/capsulectl-deal-*
            capsulectl/dist/standard-history-*
            capsulectl/dist/deal-view-*
            capsulectl/dist/deal-skill-*
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/capsulectl-book-$VERSION.sigstore.json"
          cp "$BUNDLE" "dist/capsulectl-deal-$VERSION.sigstore.json"
          (cd dist && sha256sum "capsulectl-book-$VERSION.sigstore.json" "capsulectl-deal-$VERSION.sigstore.json" >> SHA256SUMS)
      - name: Add the core's published binaries
        # After the attestation above, whose subjects are only the plugins'
        # assets: the core keeps capsule-cli's own attestation. The script
        # checks the core against its SHA256SUMS and its attestation (tag and
        # commit), runs it, installs both launchers with it, then copies it and
        # its bundle into dist/ and adds them to SHA256SUMS.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-core-assets.sh "$VERSION" dist
      - name: Check SHA256SUMS lists every asset
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(cd dist && ls | grep -vx SHA256SUMS | sort)" = "$(awk '{print $2}' dist/SHA256SUMS | sort)" \
            || { echo "SHA256SUMS does not list exactly the release's files"; exit 1; }
      - name: Publish GitHub release
        # A tag with a hyphen (v0.1.0-rc4, v1.0.0-beta1) is a pre-release:
        # published as such and never marked the latest release. gh creates
        # the release as a draft, uploads, then publishes, which immutable
        # releases allow. A draft left by a run that died mid-upload is
        # finished here; a published release is never changed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="capsulectl $VERSION"
          notes="capsulectl $VERSION: the core and the book and deal plugins, one release (linux/amd64, linux/arm64, darwin/arm64). Install the core capsulectl-$VERSION-OS-ARCH, then the plugins with capsulectl plugin install: capsulectl-book-$VERSION-OS-ARCH and capsulectl-deal-$VERSION-OS-ARCH. Unpack deal-view-$VERSION.tar.gz into the plugin directory beside capsulectl-deal, and standard-history-$VERSION.tar.gz beside capsulectl-book; deal-skill-$VERSION.tar.gz is the deal skill. Install steps: capsulectl/README.md, Install a release. Verify with: sha256sum --ignore-missing -c SHA256SUMS (the list names every platform's files). Check the build attestations with no GitHub account. The core, built by capsule-cli: gh attestation verify capsulectl-$VERSION-OS-ARCH --bundle capsulectl-$VERSION.sigstore.json --repo action-state-group/capsule-cli --signer-workflow action-state-group/capsule-cli/.github/workflows/release.yml. The plugins and archives (capsulectl-deal-$VERSION.sigstore.json is the same bundle): gh attestation verify FILE --bundle capsulectl-book-$VERSION.sigstore.json --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          flags=()
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "release $TAG is already published and final: capsulectl $VERSION has its release"
              exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --draft=false "${flags[@]}"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "$title" --notes "$notes"
          fi

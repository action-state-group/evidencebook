<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maya's order: pick a seller</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--card:#fff;--line:#d9d4c7;--go:#1f6f3d;--lim:#9a5b00;--mut:#6b675c}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eeeae0;--card:#201f1c;--line:#3a3833;--go:#6fcf8f;--lim:#f0b04a;--mut:#a09b8e}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.opt h2{margin:0;font-size:18px}.price{font-size:26px;font-weight:600}
.dec{font-weight:600}.GO{color:var(--go)}.LIMIT{color:var(--lim)}
.small{font-size:13px;color:var(--mut)}
button{margin-top:auto;font:inherit;font-weight:600;padding:12px;border-radius:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#done{margin-top:16px;font-weight:600}
</style></head><body>
<header id="banner">DEMO</header>
<main><h1 id="title">Waiting for the agent's assessments…</h1><div class="grid" id="opts"></div>
<p class="small" id="pack"></p><p class="small" id="note"></p><p id="done"></p></main>
<script>
let shown="";
async function pick(id){document.querySelectorAll("button").forEach(b=>b.disabled=true);
  await fetch("/pick",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({seller:id})});}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function tick(){
  let s;try{s=await (await fetch("/state")).json()}catch(e){return}
  if(s.banner)document.getElementById("banner").textContent=s.banner;
  if(s.phase==="popup"||s.phase==="done"){
    const key=JSON.stringify(s.options);
    if(key!==shown){shown=key;
      document.getElementById("title").textContent=s.title||"Pick a seller";
      document.getElementById("opts").innerHTML=s.options.map(o=>
        `<div class="opt"><h2>${esc(o.name)}</h2><div class="price">${esc(o.price)}</div>
         <div class="dec ${esc(o.verdict)}">${esc(o.decision)}</div>
         <div>${esc(o.card)}</div>
         ${o.rulings?`<div class="small">${esc(o.rulings)}</div>`:""}
         <button ${s.phase==="done"?"disabled":""} onclick="pick('${esc(o.id)}')">${esc(o.button)}</button></div>`).join("");}
    document.getElementById("pack").textContent=s.pack||"";
    document.getElementById("note").textContent=s.note||"";
    document.getElementById("done").textContent=s.phase==="done"?(s.message||""):"";
  }
}
setInterval(tick,700);tick();
</script></body></html>

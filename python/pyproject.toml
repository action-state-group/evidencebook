# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-evidencebook"
version = "0.1.0.dev0"
description = "An evidence book over a Checkpointed Local Log, and the evidence request interaction (draft-mih-agent-evidence-request-00, profiles evidence-interop/0 and evidence-interop/1) on both sides of it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Action State Group" }]
keywords = ["evidence", "scitt", "checkpointed-local-log", "agent-action-capsule"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Development Status :: 2 - Pre-Alpha",
]
# The request map, reply envelope, signed refusal, RFC 8785 and capsule ids
# are agent-action-capsule's; the MMR, its proofs, the checkpoint claims map,
# the SQLite log and the checkpoint runner are checkpointed-local-log's; a
# shelf's artifact store is capsule-emit's. Nothing here reimplements them.
dependencies = [
    "agent-action-capsule>=0.14.0,<0.15",
    "checkpointed-local-log>=0.8.0,<0.9",
    "capsule-emit>=0.14.0,<0.15",
    # The checkpoint reader decodes with cbor2's strict mode and keeps every
    # tag cbor2 6.1 decodes semantically raw (_cll.SEMANTIC_TAGS), so cbor2 is
    # pinned to the minor version that list was taken from.
    "cbor2>=6.1.5,<6.2",
    "cryptography>=42",
    # The x-deal-v0 profile (evidencebook.deal): jsonschema's wording is the
    # reference checker's, which the profile's negative fixtures quote, and
    # idna's UTS 46 tables are what Go's idna.Lookup maps a domain with.
    "jsonschema>=4.23,<5",
    "idna>=3.20,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/action-state-group/evidencebook"

[tool.setuptools]
packages = ["evidencebook", "evidencebook.deal"]

# The profile's schemas and the public suffix tables ship with the package.
[tool.setuptools.package-data]
"evidencebook.deal" = ["_data/schemas/*.json", "_data/schemas/records/*.json", "_data/publicsuffix/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

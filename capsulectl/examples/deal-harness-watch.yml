# Template: the outside verdict for test accounts (guide: capsule-cli docs/HARNESS.md, https://github.com/action-state-group/capsule-cli/blob/main/docs/HARNESS.md).
#
# Not run from this location -- copy it into a repo's .github/workflows/ and
# list each test account's cadence log id (`cll checkpoint cadence` prints it as
# cadence_log), and each account's checkpoint seed (32 bytes, hex) as the
# repository secret the account's `seed` names: the witness shows a log's
# checkpoint only to a read signed with the log's own key. Each account
# is one job; the run fails when any account's log stopped advancing or was
# rewritten, and the run summary lists every account's verdict. A failed
# scheduled run is the alarm: GitHub notifies the repo's watchers.
#
# This is liveness only. A test account's install ticks on a timer whether or
# not its daily deal happened, so whether the deal itself was sealed and held
# is decided from that deal's emailed receipt (capsule-cli docs/HARNESS.md, "The receipt").

name: Deal harness verdict

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account:
          # name: a label only; log: the account's cadence log id; seed: the
          # repository secret holding that account's checkpoint seed.
          - { name: account-1, log: deal-cadence/0000000000000001, seed: HARNESS_SEED_1 }
          - { name: account-2, log: deal-cadence/0000000000000002, seed: HARNESS_SEED_2 }
          - { name: account-3, log: deal-cadence/0000000000000003, seed: HARNESS_SEED_3 }
          - { name: account-4, log: deal-cadence/0000000000000004, seed: HARNESS_SEED_4 }
          - { name: control-pinned, log: deal-cadence/0000000000000005, seed: HARNESS_SEED_5 }
    env:
      WITNESS: https://witness.agentactioncapsule.org
      # A live account ticks every 5m +/- 1m, so its last checkpoint is at most
      # about 6 minutes old whenever this runs; 30m leaves room for a slow witness.
      EXPECT_EVERY: 30m
      # A capsulectl-deal release that has `canary watch` (the first one built
      # after the verb moved here from capsulectl); check the releases page.
      CAPSULECTL_DEAL_VERSION: vX.Y.Z
    steps:
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state.json
          key: harness-${{ matrix.account.name }}-${{ github.run_id }}
          restore-keys: harness-${{ matrix.account.name }}-
      - name: Install capsulectl-deal
        run: |
          base=https://github.com/action-state-group/evidencebook/releases/download/capsulectl/$CAPSULECTL_DEAL_VERSION
          curl -fsSLO "$base/capsulectl-deal-$CAPSULECTL_DEAL_VERSION-linux-amd64"
          curl -fsSLO "$base/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          install -m 0755 "capsulectl-deal-$CAPSULECTL_DEAL_VERSION-linux-amd64" "$RUNNER_TEMP/capsulectl-deal"
      - name: Verdict
        env:
          READ_SEED: ${{ secrets[matrix.account.seed] }}
        run: |
          set +e
          line=$("$RUNNER_TEMP/capsulectl-deal" canary watch --log-id "${{ matrix.account.log }}" \
            --witness "$WITNESS" --expect-every "$EXPECT_EVERY" --state state.json \
            --read-key-env READ_SEED 2>&1)
          code=$?
          case $code in
            0) verdict="advancing" ;;
            6) verdict="ALARM" ;;
            *) verdict="UNKNOWN (witness not readable)" ;;
          esac
          echo "| ${{ matrix.account.name }} | $verdict | ${line//|/\\|} |" >>"$GITHUB_STEP_SUMMARY"
          echo "$line"
          exit $code
